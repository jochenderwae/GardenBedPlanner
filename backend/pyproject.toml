[project]
name = "garden-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "fastapi>=0.139.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pywebpush>=2.3.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "integration: needs a real Postgres via TEST_DATABASE_URL (see backend/.env.example)",
]

[tool.bandit]
# B101 (assert_used) flags every `assert` as a finding - real signal in code
# that relies on assert for a security check, pure noise for internal
# invariant checks (which is the only way this codebase uses assert). Skip
# it project-wide rather than #nosec-ing each call site individually.
skips = ["B101"]
