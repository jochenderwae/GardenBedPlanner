[project]
name = "garden-etl"
version = "0.1.0"
description = "Plant-database ETL: external sources -> data/plants/*.json"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "beautifulsoup4>=4.13.0",
    "lxml>=5.3.0",
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = ["bandit>=1.8.0", "pytest>=9.1.1", "ruff>=0.15.22"]

[tool.uv]
package = false

[tool.bandit]
# B101 (assert_used) flags every `assert` as a finding - real signal in code
# that relies on assert for a security check, pure noise for internal
# invariant checks (which is the only way this codebase uses assert). Skip
# it project-wide rather than #nosec-ing each call site individually.
skips = ["B101"]
